# Publishes a release whenever main has a module version that has no release yet.
# Bump "version" in module/module.json, push to main, and this creates tag v<version> with:
#   module.json + module.zip  -> Foundry installs/updates from the manifest URL
#   Windows launcher installer + zip, built on Windows (rebuilt if missing from the release)
# It can also be started by hand from the Actions tab (workflow_dispatch).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      launcher: ${{ steps.assets.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (relay, module, launcher)
        run: |
          npm --prefix relay ci
          npm test
          npm --prefix launcher ci --ignore-scripts
          npm --prefix launcher test

      - name: Version and whether it is already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version module/module.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module.zip and the release manifest
        if: steps.ver.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p out
          (cd module && zip -qr ../out/module.zip . -x 'test/*')
          jq --arg dl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip" \
            '.download = $dl' module/module.json > out/module.json

      - name: Create tag and release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" out/module.json out/module.zip \
            --target "$GITHUB_SHA" --title "Blockworld Bridge ${TAG#v}" "${ARGS[@]}"

      - name: Does the release still need this launcher version?
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          LV=$(jq -r .version launcher/package.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qF "Setup.${LV}.exe"; then
            echo "launcher=false" >> "$GITHUB_OUTPUT"
          else
            echo "launcher=true" >> "$GITHUB_OUTPUT"
          fi

  launcher:
    needs: module
    if: needs.module.outputs.launcher == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - name: Attach installer and zip (replacing older launcher builds)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.module.outputs.tag }}
        run: |
          LV=$(jq -r .version package.json)
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.exe$|-win\.zip$' | grep -vF "${LV}"); do
            gh release delete-asset "$TAG" "$a" --yes
          done
          gh release upload "$TAG" dist/*.exe dist/*.zip --clobber
          NOTES="../.github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi

  # Diagnostic only: launcher tests on Windows. Results are written as annotations so they
  # can be read without the log files. Never blocks the release.
  launcher-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm --prefix ../relay ci # the runner test starts the real relay
      - name: Tests with per-test timeout
        run: |
          set +e
          timeout 600 node --test --test-force-exit --test-timeout=60000 --test-reporter=tap test/launcher.test.js > test-out.txt 2>&1
          code=$?
          echo "::notice title=win-exit::exit code $code (124 = whole run timed out)"
          grep -E '^(not ok|ok) ' test-out.txt | while IFS= read -r l; do echo "::notice title=win-test::$l"; done
          grep -n -A14 '^not ok' test-out.txt | head -90 | while IFS= read -r l; do echo "::warning title=win-fail::${l//%/%25}"; done
          tail -15 test-out.txt | while IFS= read -r l; do echo "::notice title=win-tail::${l//%/%25}"; done
          exit $code
